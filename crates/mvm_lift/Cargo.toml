[package]
name = "mvm_lift"
description = "Static stack-to-register lift for the Maat zkVM"
keywords = ["wasm", "zero-knowledge", "zk", "zkvm"]
categories = ["compilers", "cryptography", "wasm"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"

[features]
default = ["std"]
std = ["thiserror/std", "wasmparser/std", "mvm_decoder/std"]
alloc = ["mvm_decoder/alloc"]

[dependencies]
mvm_decoder = { workspace = true }

thiserror = { workspace = true }
wasmparser = { workspace = true }
