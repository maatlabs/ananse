[package]
name = "mvm"
version = "0.1.0"
edition.workspace = true
repository.workspace = true
license.workspace = true

[[bin]]
name = "mvm"
path = "src/main.rs"

[workspace.package]
edition = "2024"
repository = "https://github.com/maatlabs/mvm"
license = "MIT OR Apache-2.0"

[workspace]
members = []

[workspace.dependencies]

[dependencies]
anyhow = "1"
nom = "7.1.3"
nom-leb128 = "0.2"
num-derive = "0.4"
num-traits = "0.2"

[dev-dependencies]
pretty_assertions = "1.4"
wat = "1.243"
